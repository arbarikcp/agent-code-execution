[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backbone-agent"
version = "0.1.0"
description = "The evolving backbone agent for the Code Execution as an Agent's Action Space study guide."
requires-python = ">=3.10"
dependencies = [
    "litellm==1.93.0",
]

[tool.setuptools.packages.find]
where = ["src"]
